---
- name: Install ceph-common
  become: true
  block:
    - name: Install ceph-common (Debian)
      when: ansible_facts.os_family == 'Debian'
      block:
        - name: Ensure apt sources list directory exists
          ansible.builtin.file:
            path: /etc/apt/sources.list.d
            state: directory
            recurse: true

        - name: Ensure apt keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            recurse: true

        - name: Install ceph apt gpg key
          ansible.builtin.get_url:
            url: "{{ ceph_apt_key_file }}"
            dest: "/etc/apt/keyrings/ceph.gpg"
            mode: "0644"
            force: true

        - name: Ensure old ceph repository absent
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/ceph.list
            state: absent

        # TODO(mmalchuk): replace with ansible.builtin.deb822_repository module
        # when all stable releases moves to the ansible-core >= 2.15
        - name: Enable ceph apt repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/ceph.sources
            content: |
                # Ansible managed

                Types: deb
                URIs: {{ ceph_apt_url }}
                Suites: {{ ansible_facts.distribution_release }}
                Components: main
                Signed-by: /etc/apt/keyrings/ceph.gpg
            mode: "0644"

        - name: Install apt packages
          ansible.builtin.apt:
            name: "{{ ceph_apt_package }}"
            state: present
            update_cache: true

    - name: Install ceph-common (RedHat)
      when: ansible_facts.os_family == 'RedHat'
      block:
        - name: Enable ceph yum repository
          ansible.builtin.yum_repository:
            name: ceph
            description: Ceph main Repository
            baseurl: "{{ ceph_yum_baseurl }}"
            gpgcheck: "{{ ceph_yum_gpgcheck | bool }}"
            gpgkey: "{{ ceph_yum_gpgkey }}"

        - name: Enable epel yum repository
          ansible.builtin.package:
            name: "{{ epel_yum_package }}"
            state: present

        - name: Download ceph rpm gpg key
          ansible.builtin.get_url:
            url: "{{ ceph_yum_gpgkey }}"
            dest: "/etc/pki/rpm-gpg/RPM-GPG-KEY-ceph"
            mode: "0644"
            force: true
          register: ceph_yum_gpgkey_download
          when:
            - ceph_yum_gpgcheck | bool

        # NOTE(mnasiadka): ansible.builtin.rpm_key in ansible-core 2.19 parses
        # all keys from the rpm database with gpg, which fails on OpenPGP v6
        # keys (e.g. post-quantum keys shipped in Rocky Linux 10.3).
        - name: Install ceph rpm gpg key
          # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: "rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-ceph"
          changed_when: ceph_yum_gpgkey_download is changed
          when:
            - ceph_yum_gpgcheck | bool

        - name: Install RPM packages
          ansible.builtin.package:
            name: "{{ ceph_yum_package }}"
            state: present
            enablerepo: epel
